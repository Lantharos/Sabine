[package]
name = "sabine"
description = "Cross-platform Sabine application framework and native desktop runtime"
keywords = ["sabine", "desktop", "chromium", "osr", "webview"]
categories = ["gui", "rendering", "web-programming"]
include = [
    "src/**/*",
    "README.md",
    "LICENSE-MIT",
    "LICENSE-APACHE",
]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"

[dependencies]
sabine-runtime.workspace = true
sabine-bridge.workspace = true
sabine-host.workspace = true
sabine-platform.workspace = true
sabine-service.workspace = true
bytemuck.workspace = true
crossbeam-channel.workspace = true
futures-util.workspace = true
getrandom.workspace = true
glyphon.workspace = true
image.workspace = true
base64.workspace = true
libc.workspace = true
pollster.workspace = true
raw-window-handle.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
url.workspace = true
wgpu.workspace = true
winit.workspace = true
serde = { workspace = true, features = ["derive"] }
toml = { workspace = true, features = ["parse"] }
softbuffer = { version = "0.4.8", default-features = false, features = ["wayland", "wayland-dlopen"] }

[target.'cfg(target_os = "linux")'.dependencies]
ashpd.workspace = true
glow.workspace = true
khronos-egl.workspace = true
ksni.workspace = true
libloading.workspace = true
wayland-backend.workspace = true
wayland-client.workspace = true
wayland-protocols.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
global-hotkey = "0.8.0"
tray-icon = { version = "0.25.1", default-features = false }
uds_windows.workspace = true
windows-core.workspace = true
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_System_Registry",
    "Win32_System_Com",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
    "Win32_System_JobObjects",
    "Win32_Security",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
] }

[target.'cfg(target_os = "macos")'.dependencies]
shell-words = "1.1.1"
objc2.workspace = true
objc2-app-kit = { workspace = true, features = ["NSApplication", "objc2-quartz-core"] }
objc2-foundation = { workspace = true, features = ["NSArray", "NSAttributedString", "NSBundle", "NSDictionary", "NSError", "NSKeyValueObserving", "NSNotification", "NSString", "NSURL", "NSValue"] }
objc2-core-foundation.workspace = true
objc2-io-surface.workspace = true
objc2-metal.workspace = true
objc2-av-foundation.workspace = true
objc2-core-graphics.workspace = true
objc2-core-media.workspace = true
objc2-quartz-core.workspace = true
block2.workspace = true
dispatch2.workspace = true
mach2.workspace = true
global-hotkey = "0.8.0"
tray-icon = { version = "0.25.1", default-features = false }
