[package]
name = "sabine-platform"
description = "Window, shell, region, and desktop integration primitives for Sabine"
keywords = ["sabine", "platform", "window", "desktop"]
categories = ["gui", "os"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[dependencies]
raw-window-handle.workspace = true
winit.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { workspace = true, features = ["settings"] }
futures-util.workspace = true
pollster.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
block2.workspace = true
objc2.workspace = true
objc2-app-kit = { workspace = true, features = ["block2", "NSButton", "NSColor", "NSColorSpace", "NSControl", "NSApplication", "NSEvent", "NSImage", "NSWindow", "objc2-core-graphics"] }
objc2-core-foundation = { workspace = true, features = ["CFMachPort", "CFRunLoop"] }
objc2-core-graphics = { workspace = true, features = ["CGEvent", "CGEventTypes", "CGRemoteOperation"] }
objc2-foundation = { workspace = true, features = ["NSDictionary", "NSString", "NSValue"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
