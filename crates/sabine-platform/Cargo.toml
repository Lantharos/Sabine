[package]
name = "sabine-platform"
description = "Window, shell, region, and desktop integration primitives for Sabine"
keywords = ["sabine", "platform", "window", "desktop"]
categories = ["gui", "os"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[dependencies]
dunce.workspace = true
raw-window-handle.workspace = true
tokio.workspace = true
winit.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
futures-util.workspace = true
wayland-backend.workspace = true
wayland-client.workspace = true
wayland-protocols.workspace = true
wayland-scanner.workspace = true
zbus = { workspace = true, features = ["proxy"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2.workspace = true
objc2.workspace = true
objc2-app-kit = { workspace = true, features = ["block2", "NSButton", "NSColor", "NSColorSpace", "NSControl", "NSApplication", "NSEvent", "NSImage", "NSWindow", "NSWorkspace", "objc2-core-graphics"] }
objc2-core-foundation = { workspace = true, features = ["CFMachPort", "CFRunLoop"] }
objc2-core-graphics = { workspace = true, features = ["CGEvent", "CGEventTypes", "CGRemoteOperation"] }
objc2-foundation = { workspace = true, features = ["block2", "NSBundle", "NSDictionary", "NSError", "NSNotification", "NSOperation", "NSSet", "NSString", "NSURL", "NSValue"] }
objc2-user-notifications = { workspace = true, features = ["UNNotificationAction", "UNNotificationCategory"] }

[target.'cfg(target_os = "windows")'.dependencies]
sabine-runtime.workspace = true
windows = { workspace = true, features = [
    "Data_Xml_Dom",
    "Foundation",
    "UI_Notifications",
    "UI_ViewManagement",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
