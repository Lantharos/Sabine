[workspace]
resolver = "3"
members = [
    "crates/sabine-platform",
    "crates/sabine-runtime",
    "crates/sabine-bridge",
    "crates/sabine-host",
    "crates/sabine",
    "crates/sabine-service",
    "crates/sabine-cli",
    "examples/sabine-notes",
]
default-members = [
    "crates/sabine-platform",
    "crates/sabine-runtime",
    "crates/sabine-bridge",
    "crates/sabine-host",
    "crates/sabine",
    "crates/sabine-service",
    "crates/sabine-cli",
    "examples/sabine-notes",
]

[workspace.package]
version = "0.33.0"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Lantharos/Sabine"
homepage = "https://github.com/Lantharos/Sabine"
authors = ["Lantharos"]
keywords = ["sabine", "cef", "webview", "desktop", "chromium"]
categories = ["gui", "rendering"]

[workspace.dependencies]
sabine-runtime = { path = "crates/sabine-runtime", version = "0.33.0" }
sabine-platform = { path = "crates/sabine-platform", version = "0.33.0" }
sabine-bridge = { path = "crates/sabine-bridge", version = "0.33.0" }
sabine-host = { path = "crates/sabine-host", version = "0.33.0" }
sabine = { path = "crates/sabine", version = "0.33.0" }
sabine-service = { path = "crates/sabine-service", version = "0.33.0" }

ashpd = { version = "0.13.13", default-features = false, features = ["async-io", "global_shortcuts"] }
bzip2 = "0.6.1"
flate2 = "1.1.10"
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2", "deflate64", "bzip2", "lzma", "xz", "zstd"] }
tar = { version = "0.4.46", default-features = false }
bytemuck = { version = "1.25.2", features = ["derive"] }
cc = "1.6.0"
crossbeam-channel = "0.5.17"
ctrlc = "3.5.2"
dunce = "1.0.5"
fontconfig = "0.11.0"
futures-util = "0.3.34"
getrandom = "0.4.3"
global-hotkey = "0.8.0"
glyphon = "0.12.0"
glow = "0.18.0"
icns = { version = "0.5.0", default-features = false, features = ["pngio"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "bmp", "ico"] }
khronos-egl = { version = "6.0.0", features = ["dynamic"] }
libc = "0.2.190"
libloading = "0.9.0"
resvg = "0.48.1"
pollster = "1.0.1"
clap = { version = "4.6.7", features = ["derive"] }
objc2 = "0.6.4"
block2 = "0.6.2"
dispatch2 = { version = "0.3.1", default-features = false, features = ["std"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSGraphics", "NSResponder", "NSView", "NSVisualEffectView"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSGeometry", "NSObject"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std"] }
objc2-io-surface = { version = "0.3.2", default-features = false, features = ["std", "IOSurfaceRef", "libc", "objc2", "objc2-core-foundation"] }
objc2-av-foundation = { version = "0.3.2", default-features = false, features = ["std", "block2", "dispatch2", "objc2-core-foundation", "objc2-core-media", "objc2-quartz-core", "AVAnimation", "AVAsset", "AVAssetTrack", "AVMediaFormat", "AVMediaSelection", "AVMediaSelectionGroup", "AVPlayer", "AVPlayerItem", "AVPlayerItemOutput", "AVPlayerItemTrack", "AVPlayerLayer"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGColor"] }
objc2-core-media = { version = "0.3.2", default-features = false, features = ["std", "CMBase", "CMTime"] }
objc2-user-notifications = { version = "0.3.2", default-features = false, features = ["std", "block2", "UNNotification", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotificationSound", "UNNotificationTrigger", "UNNotificationSettings", "UNUserNotificationCenter"] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["std", "objc2-core-foundation", "objc2-core-graphics", "CALayer", "CAMetalLayer", "CATransaction"] }
objc2-metal = { version = "0.3.2", default-features = false, features = ["std", "MTLAllocation", "MTLDevice", "MTLPixelFormat", "MTLResource", "MTLTexture", "objc2-io-surface"] }
mach2 = "0.7.0"
raw-window-handle = "0.6.2"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
dotenvy = "0.15.7"
self-replace = "1.5.0"
semver = "1.0.28"
sha1 = "0.11.0"
sha2 = "0.11.0"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["rt", "sync", "time", "macros"] }
toml = "1.1.6"
tray-icon = { version = "0.26.0", default-features = false }
toml_edit = "0.25.15"
ureq = "3.4.2"
base64 = "0.23.1"
ed25519-dalek = "3.0.0"
url = "2.5.8"
uds_windows = "1.2.1"
wayland-backend = { version = "0.3.17", features = ["client_system"] }
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client", "staging", "unstable"] }
wgpu = "30.0.1"
winit = { git = "https://github.com/Lantharos/winit", rev = "207dc9e55467f9af10868d7d0d241c1145af2906", default-features = false, features = ["wayland", "wayland-dlopen", "wayland-csd-adwaita"] }
windows = "0.62.2"
windows-core = "0.62.2"

[patch.crates-io]
dpi = { git = "https://github.com/Lantharos/winit", rev = "207dc9e55467f9af10868d7d0d241c1145af2906" }
winit-common = { git = "https://github.com/Lantharos/winit", rev = "207dc9e55467f9af10868d7d0d241c1145af2906" }
winit-core = { git = "https://github.com/Lantharos/winit", rev = "207dc9e55467f9af10868d7d0d241c1145af2906" }

[profile.dev.package.libbz2-rs-sys]
opt-level = 3
