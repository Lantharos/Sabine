<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Notes</title>
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./app.ts"></script>
  </head>
  <body>
    <div class="app-window">
      <div class="web-titlebar">
        <div class="web-titlebar-title">Notes</div>
        <div class="window-controls" aria-hidden="true">
          <span class="window-control minimize"></span>
          <span class="window-control maximize"></span>
          <span class="window-control close"></span>
        </div>
      </div>
      <main class="shell">
        <aside class="sidebar">
          <button id="new-note" class="new-note">New note</button>
          <nav id="note-list"></nav>
          <p id="note-count" class="count">0 notes</p>
        </aside>
        <section class="content">
          <header class="editor-header">
            <input id="note-title" aria-label="Title" />
            <button id="save-note">Save</button>
            <button id="delete-note" class="ghost">Delete</button>
          </header>
          <p id="status" class="status" role="status"></p>
          <textarea id="note-body" aria-label="Body"></textarea>
        </section>
      </main>
    </div>
  </body>
</html>
