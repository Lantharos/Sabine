name: Hand over an app to Schelf

on:
  workflow_call:
    inputs:
      run_id:
        description: The Publish to Schelf run whose packages to offer on GitHub
        required: true
        type: string
      sabine_version:
        description: Sabine tag the packages were built with
        required: true
        type: string
      rust_toolchain:
        description: Rust toolchain used to build the Sabine CLI (Sabine requires 1.98 or newer)
        required: false
        type: string
        default: stable
      app:
        description: Folder of the app inside the repository, for repositories that hold several apps
        required: false
        type: string
        default: "."
      artifact:
        description: Name the builds' artifacts start with, followed by the platform
        required: false
        type: string
        default: release
    secrets:
      SABINE_UPDATE_SIGNING_KEY:
        description: The Base64 Ed25519 seed the app's GitHub releases are signed with
        required: true

jobs:
  publish:
    runs-on: ubuntu-24.04
    env:
      SABINE_UPDATE_SIGNING_KEY: ${{ secrets.SABINE_UPDATE_SIGNING_KEY }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install "${{ inputs.rust_toolchain }}" --profile minimal
      - run: rustup override set "${{ inputs.rust_toolchain }}"
      - name: Install CLI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libfontconfig1-dev libwayland-dev libxkbcommon-dev
      - name: Install matching Sabine CLI
        run: cargo install --git https://github.com/Lantharos/Sabine --tag "${{ inputs.sabine_version }}" --locked sabine-cli
      - uses: actions/download-artifact@v8
        with:
          pattern: ${{ inputs.artifact }}-*
          path: release
          merge-multiple: true
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: Generate updater manifest
        shell: pwsh
        run: |
          $arguments = @()
          Get-ChildItem release -Directory | ForEach-Object {
            $artifact = Get-ChildItem $_.FullName -File | Where-Object Extension -ne '.executable' | Select-Object -First 1
            $arguments += "--artifact"
            $arguments += "$($_.Name)=$($artifact.FullName)"
            $executable = Join-Path $_.FullName "$($_.Name).executable"
            if (Test-Path $executable) {
              $arguments += "--executable"
              $arguments += "$($_.Name)=$((Get-Content $executable -Raw).Trim())"
            }
          }
          sabine release-manifest '${{ inputs.app }}' --handover-from '${{ github.repository }}' --output release/sabine-update.json @arguments
      - name: Flatten release assets
        shell: pwsh
        run: |
          Get-ChildItem release -Directory | ForEach-Object {
            Get-ChildItem $_.FullName -File -Filter *.executable | Remove-Item
            Get-ChildItem $_.FullName -File | Move-Item -Destination release
            Remove-Item $_.FullName
          }
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag --generate-notes release/*
          gh release edit "$GITHUB_REF_NAME" --draft=false
