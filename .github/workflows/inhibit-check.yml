name: Inhibit check

on:
  push:
    branches: [experiment/inhibit-check]

permissions:
  contents: read

jobs:
  inhibit:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - run: rustup toolchain install 1.90 --profile minimal
      - run: rustup override set 1.90
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: paint-windows-latest
          cache-on-failure: true
      - run: python -m pip install websocket-client
      - run: python scripts/inhibit-check.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: inhibit-check
          path: inhibit-check/
          if-no-files-found: ignore
