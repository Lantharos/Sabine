name: Native CEF host checks

on:
  push:
    branches: [main]
    paths: &host-paths
      - crates/sabine-host/**
      - crates/sabine/src/osr/**
      - crates/sabine-runtime/**
      - crates/sabine-bridge/**
      - crates/sabine-cli/src/runtime.rs
      - crates/sabine-cli/src/runtime/**
      - Cargo.lock
      - scripts/cef/cef-cache.py
      - .github/workflows/native-host.yml
  pull_request:
    paths: *host-paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  host:
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-latest, windows-11-arm, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libwayland-dev libfontconfig1-dev libxkbcommon-dev libx11-dev libgtk-3-dev libnss3-dev libasound2-dev libgbm-dev libvulkan-dev ninja-build
      - run: rustup toolchain install stable --profile minimal
      - run: rustup override set stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: native-host
          cache-on-failure: true
      - name: Build CLI and service
        run: cargo build --locked -p sabine-cli -p sabine-service
      - name: Find the current CEF runtime
        id: cef
        run: ${{ runner.os == 'Windows' && 'python' || 'python3' }} scripts/cef/cef-cache.py
      - name: Restore the CEF runtime and host
        id: cef-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ steps.cef.outputs.directory }}
          key: ${{ steps.cef.outputs.key }}-${{ hashFiles('crates/sabine-host/**', 'crates/sabine-bridge/**') }}
          restore-keys: ${{ steps.cef.outputs.key }}-
      - name: Drop hosts built from other sources
        if: steps.cef-cache.outputs.cache-hit != 'true'
        shell: pwsh
        env:
          CEF_DIRECTORY: ${{ steps.cef.outputs.directory }}
        run: Remove-Item (Join-Path $env:CEF_DIRECTORY '.sabine-hosts') -Recurse -Force -ErrorAction Ignore
      - name: Build native CEF host
        shell: pwsh
        run: |
          $suffix = if ($IsWindows) { '.exe' } else { '' }
          $cli = "target/debug/sabine$suffix"
          $output = & $cli runtime prepare
          $output | Set-Content host-build.log
          if ($LASTEXITCODE -ne 0) { throw 'Native host preparation failed' }
          $hostPath = $output | Select-Object -Last 1
          if (-not (Test-Path -LiteralPath $hostPath -PathType Leaf)) {
            throw "Native host was not found: $hostPath"
          }
          "SABINE_HOST_PATH=$hostPath" >> $env:GITHUB_ENV
      - name: Leave the host build tree out of the cache
        if: steps.cef-cache.outputs.cache-hit != 'true'
        shell: pwsh
        env:
          CEF_DIRECTORY: ${{ steps.cef.outputs.directory }}
        run: Remove-Item (Join-Path $env:CEF_DIRECTORY '.sabine-host-build') -Recurse -Force -ErrorAction Ignore
      - name: Save the CEF runtime and host
        if: steps.cef-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.cef.outputs.directory }}
          key: ${{ steps.cef-cache.outputs.cache-primary-key }}
      - name: Permit the Linux host sandbox under AppArmor
        if: runner.os == 'Linux'
        run: |
          target/debug/sabine runtime sandbox-profile > sabine-apparmor
          sudo install -m 644 sabine-apparmor /etc/apparmor.d/sabine-ci
          sudo apparmor_parser -r /etc/apparmor.d/sabine-ci
      - name: Sign and protect the macOS host bundle
        if: runner.os == 'macOS'
        shell: pwsh
        run: |
          $bundle = Split-Path (Split-Path (Split-Path $env:SABINE_HOST_PATH))
          foreach ($helper in Get-ChildItem "$bundle/Contents/Frameworks" -Filter '*.app' -Directory) {
            & codesign --force --sign - $helper.FullName
            if ($LASTEXITCODE -ne 0) { throw 'Could not sign the helper bundle' }
          }
          & codesign --force --sign - $bundle
          if ($LASTEXITCODE -ne 0) { throw 'Could not sign the host bundle' }
          & chmod -R a-w $bundle
          if ($LASTEXITCODE -ne 0) { throw 'Could not protect the host bundle' }
      - name: Initialize the native Chromium runtime
        shell: pwsh
        run: |
          $suffix = if ($IsWindows) { '.exe' } else { '' }
          & "target/debug/sabine$suffix" runtime doctor --json | Tee-Object -FilePath host-doctor.json
          if ($LASTEXITCODE -ne 0) { throw 'Native CEF initialization failed' }
      - name: Verify the macOS signature after launch
        if: runner.os == 'macOS'
        shell: pwsh
        run: |
          $bundle = Split-Path (Split-Path (Split-Path $env:SABINE_HOST_PATH))
          & codesign --verify --deep --strict $bundle
          if ($LASTEXITCODE -ne 0) { throw 'Launching changed the signed host bundle' }
          $executions = Join-Path $env:HOME 'Library/Application Support/sabine/executions'
          $bundles = @(Get-ChildItem $executions -Directory -Recurse -Filter 'sabine-host.app')
          if ($bundles.Count -ne 1) { throw 'Expected one cached Chromium launch bundle' }
          & codesign --verify --deep --strict $bundles[0].FullName
          if ($LASTEXITCODE -ne 0) { throw 'The launch bundle signature is invalid' }

      - name: Check Windows console ownership
        if: runner.os == 'Windows'
        run: cargo test --locked -p sabine-runtime process::tests::background_children_do_not_inherit_a_console -- --exact
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-host-${{ matrix.os }}
          path: |
            host-build.log
            host-doctor.json
