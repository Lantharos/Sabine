name: Release Sabine app

on:
  workflow_call:
    inputs:
      sabine_version:
        description: Exact Sabine tag used to build the app
        required: true
        type: string
      rust_toolchain:
        description: Rust toolchain used to build the application (Sabine requires 1.98 or newer)
        required: false
        type: string
        default: stable
      accept_wix_eula:
        description: Accept the WiX 7 EULA (https://docs.firegiant.com/wix/osmf/), so Windows builds include MSI packages
        required: false
        type: boolean
        default: false
      upgrade_from_sabine_version:
        description: Optional older Sabine tag to seed before the Windows launch test
        required: false
        type: string
        default: ""
      app:
        description: Folder of the app inside the repository, for repositories that hold several apps
        required: false
        type: string
        default: "."
      platforms:
        description: Platforms to build, separated by spaces, such as "linux-x86_64 linux-aarch64"; every platform when empty
        required: false
        type: string
        default: ""
      linux_packages:
        description: More Ubuntu packages the app needs to build on Linux, separated by spaces
        required: false
        type: string
        default: ""
      version:
        description: Version to build, replacing the one in Sabine.toml, such as a nightly's 0.2.0-nightly.202611030415.g1a2b3c4
        required: false
        type: string
        default: ""
      artifact:
        description: Name the builds' artifacts start with, followed by the platform, so several apps can build in one run
        required: false
        type: string
        default: release
    secrets:
      SABINE_UPDATE_SIGNING_KEY:
        description: Base64 Ed25519 seed used to sign app update metadata; apps that update from Schelf don't use one
        required: false
      MACOS_CERTIFICATE:
        description: Base64 Developer ID Application certificate (.p12) that signs macOS apps
        required: false
      MACOS_CERTIFICATE_PASSWORD:
        description: Password of the macOS signing certificate
        required: false
      MACOS_SIGNING_IDENTITY:
        description: 'Signing identity, such as "Developer ID Application: Example (TEAMID)"'
        required: false
      APPLE_API_KEY:
        description: Contents of the App Store Connect API key (.p8) that notarizes macOS apps
        required: false
      APPLE_API_KEY_ID:
        description: Key ID of the App Store Connect API key
        required: false
      APPLE_API_ISSUER:
        description: Issuer ID of the App Store Connect API key
        required: false
      WINDOWS_CERTIFICATE:
        description: Base64 Authenticode certificate (.pfx) that signs Windows apps and installers
        required: false
      WINDOWS_CERTIFICATE_PASSWORD:
        description: Password of the Windows signing certificate
        required: false

permissions:
  contents: read

concurrency:
  group: sabine-release-app-${{ github.ref }}-${{ inputs.artifact }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      schelf: ${{ steps.plan.outputs.schelf }}
      standalone: ${{ steps.plan.outputs.standalone }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: ${{ inputs.app == '.' && 'Sabine.toml' || format('{0}/Sabine.toml', inputs.app) }}
          sparse-checkout-cone-mode: false
      - id: plan
        shell: pwsh
        env:
          APP: ${{ inputs.app }}
          PLATFORMS: ${{ inputs.platforms }}
          ACCEPT_WIX_EULA: ${{ inputs.accept_wix_eula }}
        run: |
          $config = Get-Content (Join-Path $env:APP Sabine.toml) -Raw
          $schelf = $config -match '(?ms)^\[updates\][^\[]*?^provider\s*=\s*"schelf"'
          "schelf=$($schelf.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          $standalone = $config -match '(?ms)^\[app\][^\[]*?^standalone\s*=\s*true'
          "standalone=$($standalone.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          $windows = if ($env:ACCEPT_WIX_EULA -eq 'true') { 'msi,exe,windows' } else { 'exe,windows' }
          $linux = @{ targets = 'appimage,deb,rpm,portable' }
          $platforms = @(
            @{ os = 'windows-latest'; platform = 'windows-x86_64'; targets = $windows }
            @{ os = 'windows-11-arm'; platform = 'windows-aarch64'; targets = $windows }
            @{ os = 'macos-15'; platform = 'macos-aarch64'; targets = 'dmg,macos' }
            $linux + @{ os = 'ubuntu-24.04'; platform = 'linux-x86_64'; appimagetool = 'x86_64'; appimagetool_sha256 = 'ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0' }
            $linux + @{ os = 'ubuntu-24.04-arm'; platform = 'linux-aarch64'; appimagetool = 'aarch64'; appimagetool_sha256 = 'f0837e7448a0c1e4e650a93bb3e85802546e60654ef287576f46c71c126a9158' }
          )
          $wanted = @(-split $env:PLATFORMS | Where-Object { $_ })
          $unknown = $wanted | Where-Object { $_ -notin $platforms.platform }
          if ($unknown) { throw "Sabine can't build for $($unknown -join ', ')" }
          $chosen = @($platforms | Where-Object { -not $wanted -or $_.platform -in $wanted })
          "matrix=$(ConvertTo-Json @{ include = $chosen } -Compress -Depth 3)" >> $env:GITHUB_OUTPUT

  build:
    name: Build for ${{ matrix.platform }}
    needs: plan
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    env:
      APP: ${{ inputs.app }}
      PLATFORM: ${{ matrix.platform }}
      TARGETS: ${{ matrix.targets }}
      SABINE_VERSION: ${{ inputs.sabine_version }}
      SIGN_MACOS: ${{ secrets.MACOS_CERTIFICATE != '' }}
      SIGN_WINDOWS: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Use the version being released
        if: inputs.version != ''
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: |
          $path = Join-Path $env:APP Sabine.toml
          $text = Get-Content $path -Raw
          $version = [regex]::new('(?ms)^(\[app\][^\n]*\n(?:(?!^\[).)*?^version\s*=\s*)"[^"]*"')
          if (-not $version.IsMatch($text)) { throw "Sabine.toml has no [app] version to replace" }
          [IO.File]::WriteAllText($path, $version.Replace($text, "`${1}""$env:VERSION""", 1))
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - name: Install web dependencies
        run: bun install --frozen-lockfile
      - name: Install Rust
        shell: bash
        env:
          RUST_TOOLCHAIN: ${{ inputs.rust_toolchain }}
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup override set "$RUST_TOOLCHAIN"
      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        env:
          LINUX_PACKAGES: ${{ inputs.linux_packages }}
          APPIMAGETOOL: ${{ matrix.appimagetool }}
          APPIMAGETOOL_SHA256: ${{ matrix.appimagetool_sha256 }}
        run: |
          sudo apt-get update
          # shellcheck disable=SC2086
          sudo apt-get install --yes libwayland-dev libfontconfig1-dev libxkbcommon-dev dpkg-dev rpm $LINUX_PACKAGES
          curl --fail --location --output "$RUNNER_TEMP/appimagetool" "https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-$APPIMAGETOOL.AppImage"
          echo "$APPIMAGETOOL_SHA256  $RUNNER_TEMP/appimagetool" | sha256sum --check
          sudo install -m 755 "$RUNNER_TEMP/appimagetool" /usr/local/bin/appimagetool
      - name: Install NSIS
        if: contains(matrix.targets, 'exe')
        shell: pwsh
        run: |
          choco install nsis --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw "NSIS installation failed" }
          "${env:ProgramFiles(x86)}\NSIS" >> $env:GITHUB_PATH
      - name: Install WiX
        if: contains(matrix.targets, 'msi')
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 7.0.0
          if ($LASTEXITCODE -ne 0) { throw "WiX installation failed" }
          wix eula accept wix7
          if ($LASTEXITCODE -ne 0) { throw "WiX EULA acceptance failed" }
          wix extension add --global WixToolset.UI.wixext/7.0.0
          if ($LASTEXITCODE -ne 0) { throw "WiX extension installation failed; check WiX EULA acceptance" }
      - name: Install matching Sabine CLI
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $archive = if ($IsWindows) { "sabine-cli-$env:PLATFORM.zip" } else { "sabine-cli-$env:PLATFORM.tar.gz" }
          $directory = (New-Item (Join-Path $env:RUNNER_TEMP 'sabine-cli') -ItemType Directory -Force).FullName
          gh release download $env:SABINE_VERSION --repo Lantharos/Sabine --pattern $archive --dir $directory
          if ($LASTEXITCODE -ne 0) { throw "Sabine $env:SABINE_VERSION has no CLI for $env:PLATFORM" }
          $path = Join-Path $directory $archive
          gh attestation verify $path --repo Lantharos/Sabine --signer-workflow Lantharos/Sabine/.github/workflows/release.yml --source-ref "refs/tags/$env:SABINE_VERSION"
          if ($LASTEXITCODE -ne 0) { throw "The Sabine CLI download isn't attested by Sabine's release workflow" }
          if ($IsWindows) { Expand-Archive $path -DestinationPath $directory -Force } else { tar -xzf $path -C $directory }
          if ($LASTEXITCODE -ne 0) { throw "The Sabine CLI archive could not be unpacked" }
          $directory >> $env:GITHUB_PATH
      - name: Use the matching Sabine host
        if: needs.plan.outputs.standalone == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $archive = if ($IsWindows) { "sabine-system-$env:PLATFORM.zip" } else { "sabine-system-$env:PLATFORM.tar.gz" }
          $directory = (New-Item (Join-Path $env:RUNNER_TEMP 'sabine-system') -ItemType Directory -Force).FullName
          gh release download $env:SABINE_VERSION --repo Lantharos/Sabine --pattern $archive --dir $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { throw "Sabine $env:SABINE_VERSION has no system files for $env:PLATFORM" }
          $path = Join-Path $env:RUNNER_TEMP $archive
          gh attestation verify $path --repo Lantharos/Sabine --signer-workflow Lantharos/Sabine/.github/workflows/release.yml --source-ref "refs/tags/$env:SABINE_VERSION"
          if ($LASTEXITCODE -ne 0) { throw "The Sabine system download isn't attested by Sabine's release workflow" }
          if ($IsWindows) { Expand-Archive $path -DestinationPath $directory -Force } else { tar -xzf $path -C $directory }
          if ($LASTEXITCODE -ne 0) { throw "The Sabine system archive could not be unpacked" }
          $hostBinary = if ($IsMacOS) { 'sabine-host.app/Contents/MacOS/sabine-host' } elseif ($IsWindows) { 'sabine-host.exe' } else { 'sabine-host' }
          "SABINE_HOST_PATH=$(Join-Path $directory $hostBinary)" >> $env:GITHUB_ENV
      - name: Build application
        id: build
        shell: pwsh
        run: |
          $built = sabine bundle $env:APP --target $env:TARGETS --build-only --json | Select-Object -Last 1
          if ($LASTEXITCODE -ne 0) { throw "Building the application failed" }
          "binary=$(($built | ConvertFrom-Json).binary)" >> $env:GITHUB_OUTPUT
      - name: Prepare macOS signing
        if: runner.os == 'macOS' && env.SIGN_MACOS == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain"
          read -ra keychains <<<"$(security list-keychains -d user | tr -d '"')"
          security list-keychains -d user -s "$keychain" "${keychains[@]}"
      - name: Find signtool
        if: runner.os == 'Windows' && env.SIGN_WINDOWS == 'true'
        shell: pwsh
        run: |
          $architecture = if ($env:RUNNER_ARCH -eq 'ARM64') { 'arm64' } else { 'x64' }
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.Directory.Name -eq $architecture } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if ($null -eq $signtool) { throw 'signtool.exe was not found in the Windows SDK' }
          $signtool.DirectoryName >> $env:GITHUB_PATH
      - name: Sign and package application
        shell: pwsh
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          BINARY: ${{ steps.build.outputs.binary }}
          SABINE_UPDATE_SIGNING_KEY: ${{ secrets.SABINE_UPDATE_SIGNING_KEY }}
          SABINE_MACOS_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && secrets.MACOS_CERTIFICATE != '' && secrets.MACOS_SIGNING_IDENTITY || '' }}
          APPLE_API_KEY: ${{ runner.os == 'macOS' && secrets.APPLE_API_KEY || '' }}
          SABINE_NOTARY_API_KEY_ID: ${{ runner.os == 'macOS' && secrets.APPLE_API_KEY_ID || '' }}
          SABINE_NOTARY_API_ISSUER: ${{ runner.os == 'macOS' && secrets.APPLE_API_ISSUER || '' }}
          WINDOWS_CERTIFICATE: ${{ runner.os == 'Windows' && secrets.WINDOWS_CERTIFICATE || '' }}
          SABINE_WINDOWS_CERTIFICATE_PASSWORD: ${{ runner.os == 'Windows' && secrets.WINDOWS_CERTIFICATE_PASSWORD || '' }}
        run: |
          $notaryKey = Join-Path $env:RUNNER_TEMP 'notary.p8'
          $certificate = Join-Path $env:RUNNER_TEMP 'certificate.pfx'
          try {
            if ($env:APPLE_API_KEY) {
              [IO.File]::WriteAllText($notaryKey, $env:APPLE_API_KEY)
              $env:SABINE_NOTARY_API_KEY = $notaryKey
            }
            if ($env:WINDOWS_CERTIFICATE) {
              [IO.File]::WriteAllBytes($certificate, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
              $env:SABINE_WINDOWS_CERTIFICATE = $certificate
            }
            $env:APPLE_API_KEY = $null
            $env:WINDOWS_CERTIFICATE = $null
            $bundles = @(sabine bundle $env:APP --target $env:TARGETS --binary $env:BINARY --no-web-build --json |
              Where-Object { $_.StartsWith('{') } |
              ConvertFrom-Json)
            if ($LASTEXITCODE -ne 0) { throw "Packaging the application failed" }
          } finally {
            Remove-Item $notaryKey, $certificate -Force -ErrorAction Ignore
          }
          foreach ($result in $bundles) {
            $target = $result.target
            if ($result.artifacts.Count -ne 1) { throw "Bundling $target produced no artifact" }
            $updateTarget = if ($target -in @('portable', 'windows', 'macos')) { $env:PLATFORM } else { "$env:PLATFORM-$target" }
            $destination = New-Item "dist/release/$updateTarget" -ItemType Directory -Force
            $artifact = [IO.FileInfo]::new($result.artifacts[0])
            if (-not $artifact.Exists) { throw "Bundling $target reported a missing artifact: $($artifact.FullName)" }
            $extension = if ($artifact.Name.EndsWith('.tar.zst')) { '.tar.zst' } else { $artifact.Extension }
            $base = $artifact.Name.Substring(0, $artifact.Name.Length - $extension.Length)
            $artifact.MoveTo((Join-Path $destination.FullName "$base-$updateTarget$extension"))
            if ($target -in @('portable', 'windows', 'macos')) {
              $executable = $result.executable.Replace('\', '/')
              [IO.File]::WriteAllText((Join-Path $destination.FullName "$updateTarget.executable"), $executable)
            }
          }
          $expected = @($env:TARGETS -split ',').Count
          if ($bundles.Count -ne $expected) { throw "Bundling produced $($bundles.Count) of $expected packages" }
      - name: Remove macOS signing keychain
        if: always() && runner.os == 'macOS' && env.SIGN_MACOS == 'true'
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
      - name: Check out Windows validation tools
        if: matrix.platform == 'windows-x86_64' && inputs.accept_wix_eula
        uses: actions/checkout@v7
        with:
          repository: Lantharos/Sabine
          ref: ${{ inputs.sabine_version }}
          path: .sabine-release
          persist-credentials: false
      - name: Verify installed Windows application
        if: matrix.platform == 'windows-x86_64' && inputs.accept_wix_eula
        shell: pwsh
        env:
          UPGRADE_FROM_SABINE_VERSION: ${{ inputs.upgrade_from_sabine_version }}
          STANDALONE: ${{ needs.plan.outputs.standalone }}
        run: |
          $msi = @(Get-ChildItem dist/release/windows-x86_64-msi -Filter *.msi -File)
          $stagedExe = @(Get-ChildItem dist/msi -Filter *.exe -File -Recurse)
          if ($msi.Count -ne 1 -or $stagedExe.Count -ne 1) {
            throw "expected one MSI and one staged executable"
          }
          $headers = (& llvm-objdump --private-headers $stagedExe[0].FullName 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0) {
            throw "llvm-objdump could not inspect the staged executable"
          }
          if ($headers -match '(?i)(VCRUNTIME|MSVCP|api-ms-win-crt)') {
            throw "Windows executable still depends on the redistributable C runtime"
          }
          if ($headers -notmatch '(?i)Subsystem\s+00000002\s+\(Windows GUI\)') {
            throw "Windows executable is not marked as a GUI application"
          }
          $wixSource = Get-Content (Get-ChildItem dist/msi -Filter installer.wxs -File -Recurse | Select-Object -First 1) -Raw
          $config = Get-Content (Join-Path $env:APP Sabine.toml) -Raw
          if ($config -match '(?m)^icon\s*=\s*"' -and ($wixSource -notmatch '<Icon Id="AppIcon.ico"' -or $wixSource -notmatch 'Icon="AppIcon.ico"')) {
            throw "MSI shortcut icon metadata is missing"
          }
          if ($config -notmatch '(?ms)\[app\].*?^name\s*=\s*"([^"]+)"') {
            throw "Sabine.toml app name is missing"
          }
          $appName = $Matches[1]
          $standalone = $env:STANDALONE -eq 'true'
          $expectedSabineVersion = $env:SABINE_VERSION.TrimStart('v')
          $sabineData = Join-Path $env:LOCALAPPDATA 'Sabine'
          if (Test-Path $sabineData) {
            Remove-Item $sabineData -Recurse -Force
          }
          $upgradeFrom = $env:UPGRADE_FROM_SABINE_VERSION.TrimStart('v')
          if ($upgradeFrom -and -not $standalone) {
            $oldVersionDir = Join-Path $sabineData "bin/versions/$upgradeFrom"
            New-Item $oldVersionDir -ItemType Directory -Force | Out-Null
            $oldArchive = Join-Path $env:RUNNER_TEMP "sabine-system-$upgradeFrom.zip"
            $oldRelease = "https://github.com/Lantharos/Sabine/releases/download/v$upgradeFrom/sabine-system-windows-x86_64.zip"
            Invoke-WebRequest $oldRelease -OutFile $oldArchive
            Expand-Archive $oldArchive -DestinationPath $oldVersionDir
            $state = @{ schema = 1; active = $upgradeFrom; previous = $null } | ConvertTo-Json
            $statePath = Join-Path $sabineData 'bin/current.json'
            [IO.File]::WriteAllText($statePath, $state, [Text.UTF8Encoding]::new($false))
          }
          $log = Join-Path $env:RUNNER_TEMP "sabine-msi-install.log"
          $install = Start-Process msiexec.exe -ArgumentList @('/i', $msi[0].FullName, '/qn', '/norestart', '/l*v', $log) -Wait -PassThru
          if ($install.ExitCode -ne 0) {
            . ./.sabine-release/scripts/checks/windows-package-check.ps1
            Show-InstallerLog $log
            throw "MSI installation failed with exit code $($install.ExitCode)"
          }
          if ($config -notmatch '(?ms)\[app\].*?^id\s*=\s*"([^"]+)"') { throw "Sabine.toml app id is missing" }
          $appDir = Join-Path $env:LOCALAPPDATA "Programs/$($Matches[1])"
          $installedExe = Get-ChildItem $appDir -Filter *.exe -File | Select-Object -First 1
          if ($null -eq $installedExe) {
            throw "MSI did not install the x64 application under the current user profile"
          }
          if ($config -match '(?m)^icon\s*=\s*"' -and -not (Test-Path (Join-Path $appDir 'resources/windows-app.ico'))) {
            throw "MSI did not install the application icon"
          }
          try {
            $env:SABINE_TRACE = '1'
            $appLog = Join-Path $env:RUNNER_TEMP 'sabine-msi-app.log'
            $app = Start-Process $installedExe.FullName -RedirectStandardError $appLog -PassThru
            $statePath = Join-Path $sabineData 'daemon-state.json'
            $deadline = (Get-Date).AddMinutes(15)
            $daemon = $null
            while (-not $standalone -and (Get-Date) -lt $deadline) {
              if ($app.HasExited) {
                throw "installed application exited during first-run setup with code $($app.ExitCode)"
              }
              if (Test-Path $statePath) {
                try {
                  $state = Get-Content $statePath -Raw | ConvertFrom-Json
                  if ($state.version -eq $expectedSabineVersion) {
                    $daemon = Get-Process -Id $state.pid -ErrorAction SilentlyContinue
                    if ($null -ne $daemon) {
                      break
                    }
                  }
                } catch {
                }
              }
              Start-Sleep -Seconds 2
            }
            if (-not $standalone -and $null -eq $daemon) {
              throw "Sabine $expectedSabineVersion did not finish clean first-run setup with a live daemon"
            }
            . ./.sabine-release/scripts/checks/windows-browser-check.ps1
            Wait-SabineAppFrame $app $appLog
            Test-SabineBrowser
            if ($app.HasExited) { throw "Installed application exited with code $($app.ExitCode)" }
            if ($standalone) {
              if (Test-Path (Join-Path $sabineData 'bin')) {
                throw "The standalone application installed Sabine"
              }
            } elseif ($null -eq (Get-Process -Id $daemon.Id -ErrorAction SilentlyContinue)) {
              throw "Sabine daemon exited after first-run setup"
            }
          } finally {
            if ($null -ne $app -and -not $app.HasExited) { $app.Kill($true); $app.WaitForExit() }
            Start-Process msiexec.exe -ArgumentList @('/x', $msi[0].FullName, '/qn', '/norestart') -Wait
          }
      - name: Preserve Windows startup diagnostics
        if: always() && matrix.platform == 'windows-x86_64'
        uses: actions/upload-artifact@v7
        with:
          name: startup-diagnostics-${{ inputs.artifact }}
          path: ${{ runner.temp }}/sabine-msi-*.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact }}-${{ matrix.platform }}
          path: dist/release
          if-no-files-found: error

  publish:
    needs: [plan, build]
    if: needs.plan.outputs.schelf != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      APP: ${{ inputs.app }}
      SABINE_VERSION: ${{ inputs.sabine_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Use the version being released
        if: inputs.version != ''
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: |
          $path = Join-Path $env:APP Sabine.toml
          $text = Get-Content $path -Raw
          $version = [regex]::new('(?ms)^(\[app\][^\n]*\n(?:(?!^\[).)*?^version\s*=\s*)"[^"]*"')
          if (-not $version.IsMatch($text)) { throw "Sabine.toml has no [app] version to replace" }
          [IO.File]::WriteAllText($path, $version.Replace($text, "`${1}""$env:VERSION""", 1))
      - name: Install CLI runtime dependencies
        run: sudo apt-get update && sudo apt-get install --yes libfontconfig1
      - name: Install matching Sabine CLI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          directory="$RUNNER_TEMP/sabine-cli"
          mkdir -p "$directory"
          gh release download "$SABINE_VERSION" --repo Lantharos/Sabine --pattern sabine-cli-linux-x86_64.tar.gz --dir "$directory"
          gh attestation verify "$directory/sabine-cli-linux-x86_64.tar.gz" --repo Lantharos/Sabine --signer-workflow Lantharos/Sabine/.github/workflows/release.yml --source-ref "refs/tags/$SABINE_VERSION"
          tar -xzf "$directory/sabine-cli-linux-x86_64.tar.gz" -C "$directory"
          echo "$directory" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v8
        with:
          pattern: ${{ inputs.artifact }}-*
          path: release
          merge-multiple: true
      - name: Generate updater manifest
        shell: pwsh
        env:
          SABINE_UPDATE_SIGNING_KEY: ${{ secrets.SABINE_UPDATE_SIGNING_KEY }}
        run: |
          $arguments = @()
          Get-ChildItem release -Directory | ForEach-Object {
            $artifact = Get-ChildItem $_.FullName -File | Where-Object Extension -ne '.executable' | Select-Object -First 1
            $arguments += "--artifact"
            $arguments += "$($_.Name)=$($artifact.FullName)"
            $executable = Join-Path $_.FullName "$($_.Name).executable"
            if (Test-Path $executable) {
              $arguments += "--executable"
              $arguments += "$($_.Name)=$((Get-Content $executable -Raw).Trim())"
            }
          }
          sabine release-manifest $env:APP --output release/sabine-update.json @arguments
          if ($LASTEXITCODE -ne 0) { throw "Writing the update manifest failed" }
      - name: Flatten release assets
        shell: pwsh
        run: |
          Get-ChildItem release -Directory | ForEach-Object {
            Get-ChildItem $_.FullName -File -Filter *.executable | Remove-Item
            Get-ChildItem $_.FullName -File | Move-Item -Destination release
            Remove-Item $_.FullName
          }
      - uses: actions/attest@v4
        with:
          subject-path: release/*
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag --generate-notes release/*
          gh release edit "$GITHUB_REF_NAME" --draft=false
