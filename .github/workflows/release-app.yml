name: Release Sabine app

on:
  workflow_call:
    inputs:
      sabine_version:
        description: Exact Sabine tag used to build the app
        required: true
        type: string
      rust_toolchain:
        description: Rust toolchain used to build the application (Sabine requires 1.98 or newer)
        required: false
        type: string
        default: stable
      accept_wix_eula:
        description: Accept the WiX 7 EULA for MSI builds (https://docs.firegiant.com/wix/osmf/)
        required: false
        type: boolean
        default: false
      upgrade_from_sabine_version:
        description: Optional older Sabine tag to seed before the Windows launch test
        required: false
        type: string
        default: ""
    secrets:
      SABINE_UPDATE_SIGNING_KEY:
        description: Base64 Ed25519 seed used to sign app update metadata
        required: true
      MACOS_CERTIFICATE:
        description: Base64 Developer ID Application certificate (.p12) that signs macOS apps
        required: false
      MACOS_CERTIFICATE_PASSWORD:
        description: Password of the macOS signing certificate
        required: false
      MACOS_SIGNING_IDENTITY:
        description: 'Signing identity, such as "Developer ID Application: Example (TEAMID)"'
        required: false
      APPLE_ID:
        description: Apple ID that notarizes disk images
        required: false
      APPLE_TEAM_ID:
        description: Apple developer team ID that notarizes disk images
        required: false
      APPLE_APP_PASSWORD:
        description: App-specific password for notarization
        required: false
      WINDOWS_CERTIFICATE:
        description: Base64 Authenticode certificate (.pfx) that signs Windows apps and installers
        required: false
      WINDOWS_CERTIFICATE_PASSWORD:
        description: Password of the Windows signing certificate
        required: false

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    env:
      SABINE_UPDATE_SIGNING_KEY: ${{ secrets.SABINE_UPDATE_SIGNING_KEY }}
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: msi
            update_target: windows-x86_64-msi
          - os: windows-latest
            target: exe
            update_target: windows-x86_64-exe
          - os: windows-latest
            target: windows
            update_target: windows-x86_64
          - os: windows-11-arm
            target: msi
            update_target: windows-aarch64-msi
          - os: windows-11-arm
            target: exe
            update_target: windows-aarch64-exe
          - os: windows-11-arm
            target: windows
            update_target: windows-aarch64
          - os: macos-15
            target: dmg
            update_target: macos-aarch64-dmg
          - os: macos-15
            target: macos
            update_target: macos-aarch64
          - os: ubuntu-24.04
            target: appimage
            update_target: linux-x86_64-appimage
            appimagetool: x86_64
            appimagetool_sha256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
          - os: ubuntu-24.04
            target: deb
            update_target: linux-x86_64-deb
          - os: ubuntu-24.04
            target: rpm
            update_target: linux-x86_64-rpm
          - os: ubuntu-24.04
            target: portable
            update_target: linux-x86_64
          - os: ubuntu-24.04-arm
            target: appimage
            update_target: linux-aarch64-appimage
            appimagetool: aarch64
            appimagetool_sha256: f0837e7448a0c1e4e650a93bb3e85802546e60654ef287576f46c71c126a9158
          - os: ubuntu-24.04-arm
            target: deb
            update_target: linux-aarch64-deb
          - os: ubuntu-24.04-arm
            target: rpm
            update_target: linux-aarch64-rpm
          - os: ubuntu-24.04-arm
            target: portable
            update_target: linux-aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Validate app release tag
        shell: pwsh
        run: |
          $content = Get-Content Sabine.toml -Raw
          if ($content -notmatch '(?ms)\[app\].*?^version\s*=\s*"([^"]+)"') {
            throw "Sabine.toml app version is missing"
          }
          if ($env:GITHUB_REF_NAME -ne "v$($Matches[1])") {
            throw "tag $env:GITHUB_REF_NAME does not match app version v$($Matches[1])"
          }
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install web dependencies
        run: bun install --frozen-lockfile
      - run: rustup toolchain install "${{ inputs.rust_toolchain }}" --profile minimal
      - run: rustup override set "${{ inputs.rust_toolchain }}"
      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libwayland-dev libfontconfig1-dev libxkbcommon-dev dpkg-dev rpm
          if [ -n "${{ matrix.appimagetool }}" ]; then
            curl --fail --location --output "$RUNNER_TEMP/appimagetool" "https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-${{ matrix.appimagetool }}.AppImage"
            echo "${{ matrix.appimagetool_sha256 }}  $RUNNER_TEMP/appimagetool" | sha256sum --check
            sudo install -m 755 "$RUNNER_TEMP/appimagetool" /usr/local/bin/appimagetool
          fi
      - name: Install NSIS
        if: matrix.target == 'exe'
        run: |
          choco install nsis --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw "NSIS installation failed" }
          "${env:ProgramFiles(x86)}\NSIS" >> $env:GITHUB_PATH
      - name: Install WiX
        if: matrix.target == 'msi'
        run: |
          if ('${{ inputs.accept_wix_eula }}' -ne 'true') {
            throw 'MSI builds require WiX 7 license acceptance. Review https://docs.firegiant.com/wix/osmf/ and set accept_wix_eula: true.'
          }
          dotnet tool install --global wix --version 7.0.0
          if ($LASTEXITCODE -ne 0) { throw "WiX installation failed" }
          wix eula accept wix7
          if ($LASTEXITCODE -ne 0) { throw "WiX EULA acceptance failed" }
          wix extension add --global WixToolset.UI.wixext/7.0.0
          if ($LASTEXITCODE -ne 0) { throw "WiX extension installation failed; check WiX EULA acceptance" }
      - name: Install matching Sabine CLI
        run: cargo install --git https://github.com/Lantharos/Sabine --tag "${{ inputs.sabine_version }}" --locked sabine-cli
      - name: Prepare macOS signing
        if: runner.os == 'macOS' && env.MACOS_CERTIFICATE != ''
        env:
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"
          echo "SABINE_MACOS_SIGNING_IDENTITY=$MACOS_SIGNING_IDENTITY" >> "$GITHUB_ENV"
          if [ -n "$APPLE_ID" ]; then
            echo "SABINE_NOTARY_APPLE_ID=$APPLE_ID" >> "$GITHUB_ENV"
            echo "SABINE_NOTARY_TEAM_ID=$APPLE_TEAM_ID" >> "$GITHUB_ENV"
            echo "SABINE_NOTARY_PASSWORD=$APPLE_APP_PASSWORD" >> "$GITHUB_ENV"
          fi
      - name: Prepare Windows signing
        if: runner.os == 'Windows' && env.WINDOWS_CERTIFICATE != ''
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $certificate = Join-Path $env:RUNNER_TEMP 'certificate.pfx'
          [IO.File]::WriteAllBytes($certificate, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $architecture = if ($env:RUNNER_ARCH -eq 'ARM64') { 'arm64' } else { 'x64' }
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.Directory.Name -eq $architecture } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if ($null -eq $signtool) { throw 'signtool.exe was not found in the Windows SDK' }
          $signtool.DirectoryName >> $env:GITHUB_PATH
          "SABINE_WINDOWS_CERTIFICATE=$certificate" >> $env:GITHUB_ENV
          "SABINE_WINDOWS_CERTIFICATE_PASSWORD=$env:WINDOWS_CERTIFICATE_PASSWORD" >> $env:GITHUB_ENV
      - name: Bundle application
        shell: pwsh
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          $bundle = sabine bundle . --target "${{ matrix.target }}" --release --json | Select-Object -Last 1
          if ($LASTEXITCODE -ne 0) { throw 'Bundling failed' }
          $result = $bundle | ConvertFrom-Json
          if ($result.artifacts.Count -ne 1) { throw "Bundling produced no artifact: $($result.notes -join '; ')" }
          if ('${{ matrix.target }}' -in @('portable', 'windows', 'macos')) {
            $executable = $result.executable.Replace('\', '/')
            Set-Content -NoNewline "dist/artifacts/${{ matrix.update_target }}.executable" $executable
          }
      - name: Check out Windows validation tools
        if: matrix.update_target == 'windows-x86_64-msi'
        uses: actions/checkout@v7
        with:
          repository: Lantharos/Sabine
          ref: 58b3100dfea00d7e8dff68258dd19de3ff99f4b3
          path: .sabine-release
      - name: Verify installed Windows application
        if: matrix.update_target == 'windows-x86_64-msi'
        shell: pwsh
        run: |
          $msi = @(Get-ChildItem dist/artifacts -Filter *.msi -File)
          $stagedExe = @(Get-ChildItem dist/msi -Filter *.exe -File -Recurse)
          if ($msi.Count -ne 1 -or $stagedExe.Count -ne 1) {
            throw "expected one MSI and one staged executable"
          }
          $headers = (& llvm-objdump --private-headers $stagedExe[0].FullName 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0) {
            throw "llvm-objdump could not inspect the staged executable"
          }
          if ($headers -match '(?i)(VCRUNTIME|MSVCP|api-ms-win-crt)') {
            throw "Windows executable still depends on the redistributable C runtime"
          }
          if ($headers -notmatch '(?i)Subsystem\s+00000002\s+\(Windows GUI\)') {
            throw "Windows executable is not marked as a GUI application"
          }
          $wixSource = Get-Content (Get-ChildItem dist/msi -Filter installer.wxs -File -Recurse | Select-Object -First 1) -Raw
          $config = Get-Content Sabine.toml -Raw
          if ($config -match '(?m)^icon\s*=\s*"' -and ($wixSource -notmatch '<Icon Id="AppIcon.ico"' -or $wixSource -notmatch 'Icon="AppIcon.ico"')) {
            throw "MSI shortcut icon metadata is missing"
          }
          if ($config -notmatch '(?ms)\[app\].*?^name\s*=\s*"([^"]+)"') {
            throw "Sabine.toml app name is missing"
          }
          $appName = $Matches[1]
          $expectedSabineVersion = "${{ inputs.sabine_version }}".TrimStart('v')
          $sabineData = Join-Path $env:LOCALAPPDATA 'Sabine'
          if (Test-Path $sabineData) {
            Remove-Item $sabineData -Recurse -Force
          }
          $upgradeFrom = "${{ inputs.upgrade_from_sabine_version }}".TrimStart('v')
          if ($upgradeFrom) {
            $oldVersionDir = Join-Path $sabineData "bin/versions/$upgradeFrom"
            New-Item $oldVersionDir -ItemType Directory -Force | Out-Null
            $oldArchive = Join-Path $env:RUNNER_TEMP "sabine-system-$upgradeFrom.zip"
            $oldRelease = "https://github.com/Lantharos/Sabine/releases/download/v$upgradeFrom/sabine-system-windows-x86_64.zip"
            Invoke-WebRequest $oldRelease -OutFile $oldArchive
            Expand-Archive $oldArchive -DestinationPath $oldVersionDir
            $state = @{ schema = 1; active = $upgradeFrom; previous = $null } | ConvertTo-Json
            $statePath = Join-Path $sabineData 'bin/current.json'
            [IO.File]::WriteAllText($statePath, $state, [Text.UTF8Encoding]::new($false))
          }
          $log = Join-Path $env:RUNNER_TEMP "sabine-msi-install.log"
          $install = Start-Process msiexec.exe -ArgumentList @('/i', $msi[0].FullName, '/qn', '/norestart', '/l*v', $log) -Wait -PassThru
          if ($install.ExitCode -ne 0) {
            Get-Content $log -Tail 100
            throw "MSI installation failed with exit code $($install.ExitCode)"
          }
          if ($config -notmatch '(?ms)\[app\].*?^id\s*=\s*"([^"]+)"') { throw "Sabine.toml app id is missing" }
          $appDir = Join-Path $env:LOCALAPPDATA "Programs/$($Matches[1])"
          $installedExe = Get-ChildItem $appDir -Filter *.exe -File | Select-Object -First 1
          if ($null -eq $installedExe) {
            throw "MSI did not install the x64 application under the current user profile"
          }
          if ($config -match '(?m)^icon\s*=\s*"' -and -not (Test-Path (Join-Path $appDir 'resources/windows-app.ico'))) {
            throw "MSI did not install the application icon"
          }
          try {
            $env:SABINE_TRACE = '1'
            $appLog = Join-Path $env:RUNNER_TEMP 'sabine-msi-app.log'
            $app = Start-Process $installedExe.FullName -RedirectStandardError $appLog -PassThru
            $statePath = Join-Path $sabineData 'daemon-state.json'
            $deadline = (Get-Date).AddMinutes(15)
            $daemon = $null
            while ((Get-Date) -lt $deadline) {
              if ($app.HasExited) {
                throw "installed application exited during first-run setup with code $($app.ExitCode)"
              }
              if (Test-Path $statePath) {
                try {
                  $state = Get-Content $statePath -Raw | ConvertFrom-Json
                  if ($state.version -eq $expectedSabineVersion) {
                    $daemon = Get-Process -Id $state.pid -ErrorAction SilentlyContinue
                    if ($null -ne $daemon) {
                      break
                    }
                  }
                } catch {
                }
              }
              Start-Sleep -Seconds 2
            }
            if ($null -eq $daemon) {
              throw "Sabine $expectedSabineVersion did not finish clean first-run setup with a live daemon"
            }
            . ./.sabine-release/scripts/windows-browser-check.ps1
            Wait-SabineAppFrame $app $appLog
            Test-SabineBrowser
            if ($app.HasExited) { throw "Installed application exited with code $($app.ExitCode)" }
            if ($null -eq (Get-Process -Id $daemon.Id -ErrorAction SilentlyContinue)) {
              throw "Sabine daemon exited after first-run setup"
            }
          } finally {
            if ($null -ne $app -and -not $app.HasExited) { $app.Kill($true); $app.WaitForExit() }
            Start-Process msiexec.exe -ArgumentList @('/x', $msi[0].FullName, '/qn', '/norestart') -Wait
          }
      - name: Preserve Windows startup diagnostics
        if: always() && matrix.update_target == 'windows-x86_64-msi'
        uses: actions/upload-artifact@v7
        with:
          name: startup-diagnostics
          path: ${{ runner.temp }}/sabine-msi-*.log
          if-no-files-found: ignore
      - name: Name release asset
        shell: pwsh
        run: |
          $artifact = Get-ChildItem dist/artifacts -File | Where-Object Extension -ne '.executable' | Select-Object -First 1
          $extension = if ($artifact.Name.EndsWith('.tar.gz')) { '.tar.gz' } else { $artifact.Extension }
          $base = $artifact.Name.Substring(0, $artifact.Name.Length - $extension.Length)
          Rename-Item $artifact.FullName "$base-${{ matrix.update_target }}$extension"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.update_target }}
          path: dist/artifacts/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    env:
      SABINE_UPDATE_SIGNING_KEY: ${{ secrets.SABINE_UPDATE_SIGNING_KEY }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install "${{ inputs.rust_toolchain }}" --profile minimal
      - run: rustup override set "${{ inputs.rust_toolchain }}"
      - name: Install CLI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libfontconfig1-dev libwayland-dev libxkbcommon-dev
      - name: Install matching Sabine CLI
        run: cargo install --git https://github.com/Lantharos/Sabine --tag "${{ inputs.sabine_version }}" --locked sabine-cli
      - uses: actions/download-artifact@v8
        with:
          pattern: "{linux,windows,macos}-*"
          path: release
      - name: Generate updater manifest
        shell: pwsh
        run: |
          $arguments = @()
          Get-ChildItem release -Directory | ForEach-Object {
            $artifact = Get-ChildItem $_.FullName -File | Where-Object Extension -ne '.executable' | Select-Object -First 1
            $arguments += "--artifact"
            $arguments += "$($_.Name)=$($artifact.FullName)"
            $executable = Join-Path $_.FullName "$($_.Name).executable"
            if (Test-Path $executable) {
              $arguments += "--executable"
              $arguments += "$($_.Name)=$((Get-Content $executable -Raw).Trim())"
            }
          }
          sabine release-manifest . --output release/sabine-update.json @arguments
      - name: Flatten release assets
        shell: pwsh
        run: |
          Get-ChildItem release -Directory | ForEach-Object {
            Get-ChildItem $_.FullName -File -Filter *.executable | Remove-Item
            Get-ChildItem $_.FullName -File | Move-Item -Destination release
            Remove-Item $_.FullName
          }
      - uses: actions/attest@v4
        with:
          subject-path: release/*
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag --generate-notes release/*
          gh release edit "$GITHUB_REF_NAME" --draft=false
