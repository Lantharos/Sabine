name: Published Windows runtime checks

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published Sabine release tag
        required: true
      cef_versions:
        description: Comma-separated full CEF versions to compare
        required: true

permissions:
  contents: read

jobs:
  runtime:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal
      - run: rustup override set stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked -p sabine-host --example runtime_probe
      - name: Exercise the published host with each runtime
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SABINE_CHECK_TAG: ${{ inputs.tag }}
          SABINE_CHECK_CEF_VERSIONS: ${{ inputs.cef_versions }}
        run: |
          ./scripts/windows-runtime-check.ps1 -Tag $env:SABINE_CHECK_TAG -CefVersions ($env:SABINE_CHECK_CEF_VERSIONS.Split(',')) -OutputDirectory "$env:RUNNER_TEMP/runtime-check" -ProbeExecutable "$env:GITHUB_WORKSPACE/target/debug/examples/runtime_probe.exe"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-runtime-diagnostics
          path: ${{ runner.temp }}/runtime-check/diagnostics
          if-no-files-found: error
